summary-en: Turn a story idea into a complete set of generation prompts for a stylized 3D animated short.
summary-cn: 根据故事创意，产出角色卡/场景卡图像提示词、镜头表、分镜与单镜头视频提示词的3D动画短片规格。
desc-en: Designed for creators who want to turn a story idea into a complete set of generation prompts (a spec) for a stylized 3D animated short — without generating the images or videos directly. Users provide a one-line concept or basic plot and confirm aspect ratio, duration, dialogue needs, and visual direction. The Skill creates a project brief and story outline, writes character-card image prompts (Qwen-Image by default) and environment-only scene-card image prompts, plans a six-column shot table with per-second action, camera, audio, and continuity requirements, produces text storyboards, and writes single-shot video prompts (h3-prompt-writing by default). It outputs a ready-to-hand-off prompt spec with consistent characters, continuous scenes, and controlled pacing. Best for narrative animation planning, prompt authoring, and feeding downstream image/video tools; not for generating final images or videos, simple retouching, photorealistic live action, or one standalone prompt.
desc-cn: 面向希望将故事灵感整理成完整3D动画短片生成提示词规格（spec）的创作者——本技能不直接生成图像或视频，只产出可交给下游生成工具的提示词。用户提供一句故事创意或基础剧情，并确认画面比例、总时长、对白需求和目标风格。Skill 依次完成项目简报与故事大纲，编写角色卡图像提示词（默认 Qwen-Image）与无人物场景卡图像提示词，规划带每秒动作、镜头、音频与连续性要求的六列镜头表，制作文本分镜，并编写单镜头视频提示词（默认走 h3-prompt-writing）。最终输出角色一致、场景连续、节奏完整的提示词规格。适用于剧情动画的提示词规划与生成；不负责生成最终图像或视频，不适用于单张图片、简单修图、真人写实视频或单一独立提示词。
