summary-en: Turn a story idea into a complete set of generation prompts for a Chinese-style cinematic photoreal CG animated short, with a locked guofeng style, a 3–5 second opening title segment at the head of shot 1 that resolves into the story action, and H3 video prompts that default to Ref2VA with character/scene cards as global references.
summary-cn: 根据故事创意，产出锁定国风仙侠写实CG风格的3D动画短片规格：角色卡/场景卡图像提示词、S01 开头 3–5 秒的片头标题段（可引用角色/场景作主题背景，同一镜头内转入剧情）、镜头表、分镜与单镜头视频提示词（H3 默认 Ref2VA，角色卡/场景卡作全局参考素材）。
desc-en: Designed for creators who want to turn a story idea into a complete set of generation prompts (a spec) for a Chinese-style cinematic photoreal CG animated short — without generating the images or videos directly. Users provide a one-line concept or basic plot and confirm aspect ratio, duration, dialogue needs, and visual direction. Every artifact is locked to a guofeng / xianxia high-end CG look — near-photoreal rendering, desaturated moon-white and frost-blue palette, volumetric mist, translucent silk backlight, strand-level hair, ink-wash landscapes, filmic shallow depth of field, and restrained realistic performance — while character identity, costume, and world details come from the story rather than any reference character. The Skill creates a project brief and story outline, writes character-card image prompts (Qwen-Image by default) and environment-only scene-card image prompts, designs a 3–5 second opening title segment at the head of shot 1 that shows the exact title and author credit, may use approved characters or scenes as thematic background, randomly picks splash-ink brush or blade-edge lettering when no font is specified, and resolves into S01's story action inside the same continuous shot — with no separate opening shot; plans a six-column shot table whose first row is S01 and opens with that segment, with per-second action, camera, audio, and continuity requirements, produces text storyboards, and writes single-shot video prompts (h3-prompt-writing by default, S01 first). When H3 is chosen, prompts default to Ref2VA and use the approved character and scene cards as a global reference library, with a manifest mapping cards to stable subject IDs. It outputs a ready-to-hand-off prompt spec with consistent characters, continuous scenes, and controlled pacing. Best for narrative animation planning, prompt authoring, and feeding downstream image/video tools; not for generating final images or videos, simple retouching, photorealistic live action, or one standalone prompt.
desc-cn: 面向希望将故事灵感整理成完整国风3D动画短片生成提示词规格（spec）的创作者——本技能不直接生成图像或视频，只产出可交给下游生成工具的提示词。用户提供一句故事创意或基础剧情，并确认画面比例、总时长、对白需求和目标风格。全流程锁定国风仙侠影视级写实CG风格（近写实渲染、低饱和月白霜青色系、体积雾、纱衣透射逆光、发丝级细节、水墨远山、电影级浅景深、克制写实表演），但角色身份、服装与世界设定完全来自故事，不套用任何参考人物。Skill 依次完成项目简报与故事大纲，编写角色卡图像提示词（默认 Qwen-Image）与无人物场景卡图像提示词，设计 S01 开头 3–5 秒的片头标题段（逐字展示片名与署名，可引用角色/场景作主题背景；用户未指定字体时从泼墨豪放手写 / 尖角刀锋艺术字中随机二选一；在同一镜头内自然转入 S01 剧情动作，不单列片头镜头），规划以 S01 为首行、以该标题段开场的六列镜头表，制作文本分镜，并编写单镜头视频提示词（默认走 h3-prompt-writing，S01 优先）。选用 H3 时默认生成 Ref2VA 提示词，把角色卡与场景卡作为全局参考素材，并用清单把卡映射到稳定的主体编号。缺片名、署名、比例、时长等关键信息时会先询问用户，不臆造。最终输出角色一致、场景连续、节奏完整、风格统一的提示词规格。适用于国风剧情动画的提示词规划与生成；不负责生成最终图像或视频，不适用于单张图片、简单修图、真人写实视频或单一独立提示词。
